<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMADU Digital Portal - Pengumuman Kelulusan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');
        
        :root {
            --primary-cyan: #00bcd4;
            --dark-cyan: #00838f;
            --bg-color: #f0f9ff;
            --card-bg: rgba(255, 255, 255, 0.85);
            --text-main: #1e293b;
            --text-muted: #64748b;
            --grid-color: rgba(0, 188, 212, 0.1);
        }

        .dark-mode {
            --primary-cyan: #00e5ff;
            --dark-cyan: #008ba3;
            --bg-color: #030712;
            --card-bg: rgba(15, 23, 42, 0.6);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --grid-color: rgba(0, 229, 255, 0.05);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            transition: background-color 0.5s ease, color 0.5s ease;
        }

        .bg-tech {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(circle at 50% 50%, var(--bg-color) 0%, var(--bg-color) 100%);
        }

        .bg-tech::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 40px 40px;
            mask-image: radial-gradient(ellipse at center, black, transparent 85%);
        }

        .glow-sphere {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(0, 188, 212, 0.2) 0%, transparent 70%);
            border-radius: 50%;
            filter: blur(60px);
            animation: move 25s infinite alternate ease-in-out;
        }

        @keyframes move {
            from { transform: translate(-15%, -15%) scale(1); }
            to { transform: translate(25%, 25%) scale(1.1); }
        }

        .glass-panel {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 188, 212, 0.2);
            border-radius: 32px;
            box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.1);
            transition: all 0.4s ease;
        }

        /* Geometric Morph Animation */
        .morph-container {
            position: absolute;
            inset: 0;
            overflow: hidden;
            z-index: 0;
            pointer-events: none;
        }

        .morph-shape {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 300px;
            background: linear-gradient(45deg, var(--primary-cyan), transparent);
            filter: blur(40px);
            opacity: 0.3;
            animation: morphing 10s infinite alternate ease-in-out;
        }

        @keyframes morphing {
            0% { border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%; transform: translate(-50%, -50%) rotate(0deg) scale(1); }
            33% { border-radius: 50% 50% 20% 80% / 50% 20% 80% 50%; transform: translate(-50%, -50%) rotate(120deg) scale(1.2); }
            66% { border-radius: 80% 20% 50% 50% / 20% 50% 50% 80%; transform: translate(-50%, -50%) rotate(240deg) scale(0.8); }
            100% { border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%; transform: translate(-50%, -50%) rotate(360deg) scale(1); }
        }

        .cyan-glow-text {
            text-shadow: 0 0 20px rgba(0, 229, 255, 0.8), 0 0 10px rgba(0, 229, 255, 0.4);
        }

        .btn-cyan {
            background: linear-gradient(135deg, var(--primary-cyan), var(--dark-cyan));
            color: white;
            font-weight: 700;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 25px -5px rgba(0, 188, 212, 0.4);
        }

        .btn-cyan:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px -5px rgba(0, 188, 212, 0.6);
            filter: brightness(1.1);
        }

        .input-field {
            background: rgba(0, 0, 0, 0.03);
            border: 2px solid rgba(0, 188, 212, 0.1);
            color: var(--text-main);
            transition: all 0.3s ease;
        }

        .dark-mode .input-field {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(0, 229, 255, 0.1);
        }

        .input-field:focus {
            border-color: var(--primary-cyan);
            background: white;
            box-shadow: 0 0 20px rgba(0, 188, 212, 0.2);
        }

        /* Oval Lonjong Photo */
        .profile-oval {
            width: 120px;
            height: 160px;
            margin: 0 auto;
            border-radius: 60px;
            overflow: hidden;
            border: 4px solid white;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            background: var(--primary-cyan);
        }

        .profile-oval img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        header {
            background: rgba(255, 255, 255, 0.7);
            border-bottom: 1px solid rgba(0, 188, 212, 0.1);
        }

        .dark-mode header {
            background: rgba(3, 7, 18, 0.8);
            border-bottom: 1px solid rgba(0, 229, 255, 0.1);
        }

        #theme-toggle {
            width: 45px;
            height: 45px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            background: rgba(0, 188, 212, 0.1);
            color: var(--primary-cyan);
            transition: all 0.3s ease;
        }

        /* Balloon Animation */
        .balloon-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
            overflow: hidden;
        }

        .balloon {
            position: absolute;
            bottom: -150px;
            width: 60px;
            height: 80px;
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            opacity: 0.8;
            animation: float-up linear forwards;
        }

        .balloon::after {
            content: "";
            position: absolute;
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 2px;
            height: 50px;
            background: rgba(255, 255, 255, 0.3);
        }

        @keyframes float-up {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { transform: translateY(-120vh) rotate(20deg); opacity: 0; }
        }
    </style>
</head>
<body class="">

    <div class="bg-tech">
        <div class="glow-sphere" style="top: 5%; left: 5%;"></div>
        <div class="glow-sphere" style="bottom: 5%; right: 5%; animation-delay: -7s;"></div>
    </div>

    <!-- Balloon Container -->
    <div id="balloon-container" class="balloon-container"></div>

    <!-- Header -->
    <header class="fixed top-0 w-full z-40 backdrop-blur-xl">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <a href="#" onclick="window.location.reload()" class="transition-transform hover:scale-105">
                <img id="banner-logo" src="" alt="SMADU Banner" class="h-10 md:h-12">
            </a>
            <div class="flex items-center gap-4">
                <div id="theme-toggle" title="Ganti Mode Tampilan">
                    <i class="fas fa-moon" id="theme-icon"></i>
                </div>
                <div class="hidden md:block text-[10px] font-black tracking-[0.2em] text-cyan-600 dark:text-cyan-400 uppercase opacity-60">
                    Digital Portal v2.5
                </div>
            </div>
        </div>
    </header>

    <main class="flex-grow flex items-center justify-center p-6 mt-20">
        <div id="app-container" class="w-full max-w-lg">
            
            <!-- SECTION LOGIN -->
            <div id="login-section" class="glass-panel p-8 md:p-10 transition-all duration-500">
                <div class="text-center mb-10">
                    <img id="school-logo" src="" alt="Logo Sekolah" class="w-24 h-24 mx-auto mb-6 drop-shadow-xl">
                    <h1 class="text-3xl font-extrabold tracking-tight mb-2 uppercase text-cyan-600 dark:text-cyan-400">Portal Autentikasi</h1>
                    <p class="text-muted text-sm font-medium">Sistem Informasi Kelulusan Digital SMADU</p>
                </div>

                <form id="login-form" class="space-y-6">
                    <div class="space-y-2">
                        <label class="text-[10px] font-black uppercase tracking-widest text-cyan-600 dark:text-cyan-400 ml-1">ID Pengguna (NISN)</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-cyan-500">
                                <i class="fas fa-user-shield"></i>
                            </span>
                            <input type="text" id="nisn" required placeholder="Masukkan NISN" 
                                class="input-field w-full pl-12 pr-4 py-4 rounded-2xl outline-none text-lg font-semibold">
                        </div>
                    </div>
                    
                    <div class="space-y-2">
                        <label class="text-[10px] font-black uppercase tracking-widest text-cyan-600 dark:text-cyan-400 ml-1">Kata Sandi (Tgl Lahir)</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-cyan-500">
                                <i class="fas fa-lock"></i>
                            </span>
                            <input type="date" id="dob" required 
                                class="input-field w-full pl-12 pr-4 py-4 rounded-2xl outline-none font-semibold">
                        </div>
                    </div>

                    <button type="submit" id="btn-login" class="btn-cyan w-full py-5 rounded-2xl text-sm uppercase tracking-[0.2em] active:scale-95">
                        Masuk Sistem <i class="fas fa-shield-alt ml-2"></i>
                    </button>
                </form>
                <p id="error-msg" class="text-red-500 text-xs font-bold text-center mt-6 hidden uppercase tracking-wider"></p>
            </div>

            <!-- SECTION HASIL -->
            <div id="result-section" class="glass-panel p-8 md:p-10 hidden text-center scale-95 opacity-0 transition-all duration-700">
                <!-- Geometric Morph Background -->
                <div class="morph-container">
                    <div class="morph-shape"></div>
                </div>

                <div class="relative z-10">
                    <div class="mb-8">
                        <div class="profile-oval relative">
                            <img id="student-photo" src="" alt="Foto Siswa">
                        </div>
                        <div id="badge-status" class="mt-4 inline-flex items-center gap-2 px-4 py-2 rounded-full text-[10px] font-black uppercase tracking-widest shadow-sm"></div>
                    </div>

                    <h2 id="student-name" class="text-3xl font-extrabold mb-1"></h2>
                    <div class="flex justify-center gap-2 mb-8">
                        <span class="bg-cyan-500/10 text-cyan-600 dark:text-cyan-400 px-3 py-1 rounded-lg text-[10px] font-black border border-cyan-500/10" id="display-nisn"></span>
                        <span class="bg-cyan-500/10 text-cyan-600 dark:text-cyan-400 px-3 py-1 rounded-lg text-[10px] font-black border border-cyan-500/10" id="display-kelas"></span>
                    </div>

                    <div id="result-box" class="mb-10 p-8 rounded-3xl border border-cyan-500/10 relative overflow-hidden bg-white/50 dark:bg-black/20">
                        <div id="result-bg-glow" class="absolute inset-0 opacity-40"></div>
                        <div class="relative z-10">
                            <p class="text-[10px] uppercase tracking-[0.3em] opacity-50 font-bold mb-4">Status Pernyataan Resmi</p>
                            <div id="result-message" class="text-2xl font-black leading-tight italic"></div>
                        </div>
                    </div>

                    <div class="space-y-4">
                        <button onclick="window.location.reload()"
                            class="w-full btn-cyan py-5 rounded-2xl flex items-center justify-center text-xs tracking-[0.2em] shadow-xl">
                            <i class="fas fa-power-off text-xl mr-3"></i> KELUAR SISTEM
                        </button>
                        <p class="text-muted text-[10px] font-bold uppercase tracking-widest opacity-60">Silakan hubungi pihak sekolah untuk fisik SKL</p>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- FOOTER -->
    <footer class="p-6 text-center opacity-30 text-[9px] tracking-[0.3em] uppercase font-bold">
        © 2024 SMA Negeri 2 Kraksaan • Digital Innovation
    </footer>

    <!-- LOADING SCREEN -->
    <div id="loading-overlay" class="fixed inset-0 bg-white/90 dark:bg-slate-950/90 backdrop-blur-2xl hidden flex items-center justify-center z-50">
        <div class="text-center">
            <div class="relative w-20 h-20 mx-auto mb-6">
                <div class="absolute inset-0 border-4 border-cyan-500/10 rounded-full"></div>
                <div class="absolute inset-0 border-4 border-t-cyan-500 rounded-full animate-spin"></div>
            </div>
            <p class="text-cyan-600 dark:text-cyan-400 font-black tracking-[0.4em] text-[10px]">ANALYZING SECURITY...</p>
        </div>
    </div>

    <script>
        const SPREADSHEET_ID = '1n2AbcanvLazitNX5DEHzXSyJAkasi-aPwV9p8Enrscg';
        const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv`;

        const LOGO_SEKOLAH_DRIVE = 'https://drive.google.com/file/d/1x1MSfNaTTi7orhMLm32rzdmWblRZbqoQ/view?usp=sharing';
        const BANNER_LOGO_DRIVE = 'https://drive.google.com/file/d/1K6HO-kZnuRyiXHhvJkKRbCiquyv6_8HC/view?usp=sharing';

        function getDirectDriveLink(url) {
            if (!url) return '';
            const driveIdMatch = url.match(/\/file\/d\/([^\/]+)\//) || url.match(/[?&]id=([^&]+)/);
            if (driveIdMatch && driveIdMatch[1]) {
                return `https://lh3.googleusercontent.com/u/0/d/${driveIdMatch[1]}=w800`;
            }
            return url;
        }

        const themeToggle = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        
        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            themeIcon.className = isDark ? 'fas fa-sun' : 'fas fa-moon';
        });

        window.onload = () => {
            document.getElementById('school-logo').src = getDirectDriveLink(LOGO_SEKOLAH_DRIVE);
            document.getElementById('banner-logo').src = getDirectDriveLink(BANNER_LOGO_DRIVE);
        };

        const loginForm = document.getElementById('login-form');
        const loginSection = document.getElementById('login-section');
        const resultSection = document.getElementById('result-section');
        const loadingOverlay = document.getElementById('loading-overlay');
        const errorMsg = document.getElementById('error-msg');

        function formatDateToKey(dateStr) {
            const date = new Date(dateStr);
            const d = String(date.getDate()).padStart(2, '0');
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const y = date.getFullYear();
            return `${d}${m}${y}`;
        }

        function createBalloons() {
            const container = document.getElementById('balloon-container');
            const colors = ['#00bcd4', '#00e5ff', '#ffeb3b', '#ff4081', '#7c4dff'];
            for (let i = 0; i < 25; i++) {
                setTimeout(() => {
                    const balloon = document.createElement('div');
                    balloon.className = 'balloon';
                    balloon.style.left = Math.random() * 100 + 'vw';
                    balloon.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    balloon.style.animationDuration = (Math.random() * 3 + 4) + 's';
                    balloon.style.width = (Math.random() * 20 + 40) + 'px';
                    balloon.style.height = (parseFloat(balloon.style.width) * 1.3) + 'px';
                    container.appendChild(balloon);
                    setTimeout(() => balloon.remove(), 8000);
                }, i * 150);
            }
        }

        // Fungsi Simulasi Tepuk Tangan menggunakan Audio Context
        function playApplause() {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (!AudioContext) return;
            const ctx = new AudioContext();
            const duration = 2;
            const bufferSize = ctx.sampleRate * duration;
            const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
            const data = buffer.getChannelData(0);

            for (let i = 0; i < bufferSize; i++) {
                data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (ctx.sampleRate * 0.5));
            }

            const noise = ctx.createBufferSource();
            noise.buffer = buffer;
            const filter = ctx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.value = 1000;
            
            noise.connect(filter);
            filter.connect(ctx.destination);
            noise.start();
        }

        let celebrationInterval;
        let celebrationStep = 0;

        function startRotatingCelebration() {
            // Hentikan interval lama jika ada
            if (celebrationInterval) clearInterval(celebrationInterval);

            const runStep = () => {
                switch(celebrationStep % 4) {
                    case 0: // Konfeti
                        confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
                        break;
                    case 1: // Kembang Api
                        const animationEnd = Date.now() + 3000;
                        const fwInterval = setInterval(() => {
                            if (Date.now() > animationEnd) return clearInterval(fwInterval);
                            confetti({ startVelocity: 30, spread: 360, ticks: 60, zIndex: 0, particleCount: 40, origin: { x: Math.random(), y: Math.random() - 0.2 } });
                        }, 200);
                        break;
                    case 2: // Balon
                        createBalloons();
                        break;
                    case 3: // Tepuk Tangan (Visual & Audio simulasi)
                        playApplause();
                        confetti({ particleCount: 100, scalar: 2, shapes: ['circle'], colors: ['#FFD700'] }); // Emas untuk tepuk tangan
                        break;
                }
                celebrationStep++;
            };

            runStep(); // Jalankan segera
            celebrationInterval = setInterval(runStep, 5000); // Ganti efek setiap 5 detik
        }

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMsg.classList.add('hidden');
            loadingOverlay.classList.remove('hidden');

            const inputNisn = document.getElementById('nisn').value.trim();
            const inputPass = formatDateToKey(document.getElementById('dob').value);

            try {
                const response = await fetch(SHEET_URL);
                const csvData = await response.text();
                const rows = csvData.split('\n').map(row => 
                    row.split(',').map(cell => cell.replace(/^"(.*)"$/, '$1').trim())
                );

                const studentData = rows.slice(1).find(row => 
                    row[0] === inputNisn && row[1] === inputPass
                );

                if (studentData) {
                    setTimeout(() => displayStudent(studentData), 1200);
                } else {
                    errorMsg.innerText = "Error: NISN atau Tanggal Lahir tidak valid.";
                    errorMsg.classList.remove('hidden');
                    loadingOverlay.classList.add('hidden');
                }
            } catch (error) {
                errorMsg.innerText = "Error: Kegagalan Sinkronisasi Database.";
                errorMsg.classList.remove('hidden');
                loadingOverlay.classList.add('hidden');
            }
        });

        function displayStudent(data) {
            const [nisn, pass, nama, kelas, statusLulus, foto, sk] = data;

            loadingOverlay.classList.add('hidden');
            loginSection.classList.add('hidden');
            resultSection.classList.remove('hidden');
            
            setTimeout(() => {
                resultSection.classList.remove('scale-95', 'opacity-0');
            }, 100);

            document.getElementById('student-name').innerText = nama;
            document.getElementById('display-nisn').innerText = "NISN " + nisn;
            document.getElementById('display-kelas').innerText = "ROMBEL " + kelas;
            
            const photoImg = document.getElementById('student-photo');
            photoImg.src = getDirectDriveLink(foto) || `https://ui-avatars.com/api/?name=${nama}&background=00bcd4&color=fff`;

            const resultMsg = document.getElementById('result-message');
            const resultGlow = document.getElementById('result-bg-glow');
            const badge = document.getElementById('badge-status');

            const isLulus = statusLulus.toLowerCase() === "lulus";

            if (isLulus) {
                resultMsg.innerText = "SELAMAT! ANDA DINYATAKAN LULUS";
                resultMsg.className = "text-2xl font-black text-white cyan-glow-text";
                resultGlow.style.background = "radial-gradient(circle, #00bcd4 0%, transparent 70%)";
                badge.className = "mt-4 inline-flex items-center gap-2 px-4 py-2 rounded-full text-[10px] font-black uppercase tracking-widest bg-green-500 text-white shadow-lg";
                badge.innerHTML = '<i class="fas fa-check-circle"></i> Berhasil Lulus';
                startRotatingCelebration();
            } else {
                resultMsg.innerText = "MAAF, ANDA DINYATAKAN TIDAK LULUS";
                resultMsg.className = "text-2xl font-black text-red-500";
                resultGlow.style.background = "radial-gradient(circle, #ef4444 0%, transparent 70%)";
                badge.className = "mt-4 inline-flex items-center gap-2 px-4 py-2 rounded-full text-[10px] font-black uppercase tracking-widest bg-red-600 text-white shadow-lg";
                badge.innerHTML = '<i class="fas fa-times-circle"></i> Belum Berhasil';
            }
        }
    </script>
</body>
</html>
