<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMADU Digital Portal - Pengumuman Kelulusan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');
        
        :root {
            --primary-cyan: #00bcd4;
            --dark-cyan: #00838f;
            --bg-color: #f0f9ff;
            --card-bg: rgba(255, 255, 255, 0.85);
            --text-main: #1e293b;
            --text-muted: #64748b;
            --grid-color: rgba(0, 188, 212, 0.1);
        }

        .dark-mode {
            --primary-cyan: #00e5ff;
            --dark-cyan: #008ba3;
            --bg-color: #030712;
            --card-bg: rgba(15, 23, 42, 0.6);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --grid-color: rgba(0, 229, 255, 0.05);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            transition: background-color 0.5s ease, color 0.5s ease;
        }

        .bg-tech {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background: radial-gradient(circle at 50% 50%, var(--bg-color) 0%, var(--bg-color) 100%);
        }

        .bg-tech::after {
            content: "";
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 40px 40px;
            mask-image: radial-gradient(ellipse at center, black, transparent 85%);
        }

        /* Glass Panel Styling */
        .glass-panel {
            position: relative;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 188, 212, 0.2);
            border-radius: 32px;
            box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.1);
            transition: all 0.4s ease;
            overflow: hidden;
            z-index: 10;
        }

        /* Geometric Morph Background */
        .morph-container {
            position: absolute; inset: 0;
            overflow: hidden; z-index: 0;
            pointer-events: none;
        }

        .morph-shape {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 450px; height: 450px;
            background: linear-gradient(135deg, var(--primary-cyan) 0%, transparent 100%);
            filter: blur(50px);
            opacity: 0.2;
            animation: morphing 15s infinite alternate linear;
        }

        @keyframes morphing {
            0% { border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%; transform: translate(-50%, -50%) rotate(0deg) scale(1); }
            50% { border-radius: 50% 50% 33% 67% / 55% 27% 73% 45%; transform: translate(-45%, -55%) rotate(180deg) scale(1.1); }
            100% { border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%; transform: translate(-50%, -50%) rotate(360deg) scale(1); }
        }

        /* Profile & Buttons */
        .profile-oval {
            width: 120px; height: 160px;
            margin: 0 auto; border-radius: 60px;
            overflow: hidden; border: 4px solid white;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            background: var(--primary-cyan);
        }

        .profile-oval img { width: 100%; height: 100%; object-fit: cover; }

        .btn-cyan {
            background: linear-gradient(135deg, var(--primary-cyan), var(--dark-cyan));
            color: white; font-weight: 700;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 25px -5px rgba(0, 188, 212, 0.4);
        }

        .btn-cyan:hover { transform: translateY(-3px); filter: brightness(1.1); }

        /* Animation Assets */
        .balloon-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 100; overflow: hidden;
        }

        .balloon {
            position: absolute; bottom: -150px;
            width: 60px; height: 80px;
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            animation: float-up linear forwards;
        }

        @keyframes float-up {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { transform: translateY(-120vh) rotate(20deg); opacity: 0; }
        }

        .clap-emoji {
            position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 8rem; z-index: 101; pointer-events: none;
            animation: clap-pop 0.8s ease-out forwards;
        }

        @keyframes clap-pop {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
            50% { transform: translate(-50%, -50%) scale(1.5); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
        }

        .firecracker-visual {
            position: fixed; width: 10px; height: 30px;
            background: red; border-radius: 5px;
            z-index: 99; pointer-events: none;
            animation: firecracker-fly 1s ease-out forwards;
        }

        @keyframes firecracker-fly {
            0% { transform: translate(0,0) rotate(0deg); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) rotate(720deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="bg-tech"></div>
    <div id="balloon-container" class="balloon-container"></div>
    <div id="fx-layer"></div>

    <header class="fixed top-0 w-full z-40 backdrop-blur-xl">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <img id="banner-logo" src="" alt="SMADU Banner" class="h-10 md:h-12 cursor-pointer" onclick="window.location.reload()">
            <div id="theme-toggle" class="w-12 h-12 flex items-center justify-center rounded-xl bg-cyan-500/10 text-cyan-500 cursor-pointer">
                <i class="fas fa-moon" id="theme-icon"></i>
            </div>
        </div>
    </header>

    <main class="flex-grow flex items-center justify-center p-6 mt-20">
        <div class="w-full max-w-lg">
            
            <!-- Login Section -->
            <div id="login-section" class="glass-panel p-8 md:p-10">
                <div class="text-center mb-10">
                    <img id="school-logo" src="" alt="Logo Sekolah" class="w-20 h-20 mx-auto mb-4">
                    <h1 class="text-2xl font-black text-cyan-600 dark:text-cyan-400">PORTAL KELULUSAN</h1>
                </div>
                <form id="login-form" class="space-y-6">
                    <input type="text" id="nisn" required placeholder="Masukkan NISN" class="w-full p-4 rounded-2xl bg-black/5 dark:bg-white/5 border border-cyan-500/20 outline-none focus:border-cyan-500">
                    <input type="date" id="dob" required class="w-full p-4 rounded-2xl bg-black/5 dark:bg-white/5 border border-cyan-500/20 outline-none focus:border-cyan-500">
                    <button type="submit" class="btn-cyan w-full py-4 rounded-2xl uppercase tracking-widest">Akses Pengumuman</button>
                </form>
                <p id="error-msg" class="text-red-500 text-xs mt-4 text-center hidden"></p>
            </div>

            <!-- Result Section -->
            <div id="result-section" class="glass-panel p-8 md:p-10 hidden opacity-0 transition-all duration-700">
                <div class="morph-container"><div class="morph-shape"></div></div>
                <div class="relative z-10 text-center">
                    <div class="profile-oval mb-6"><img id="student-photo" src=""></div>
                    <div id="badge-status" class="inline-block px-4 py-1 rounded-full text-[10px] font-black uppercase mb-4"></div>
                    <h2 id="student-name" class="text-2xl font-extrabold mb-1"></h2>
                    <p id="display-nisn" class="text-xs font-bold text-cyan-600 mb-6"></p>
                    
                    <div class="bg-white/40 dark:bg-black/20 p-6 rounded-3xl border border-white/20 mb-8">
                        <p class="text-[10px] uppercase tracking-widest opacity-60 mb-2">Pernyataan Resmi</p>
                        <div id="result-message" class="text-xl font-black italic"></div>
                    </div>

                    <button onclick="window.location.reload()" class="btn-cyan w-full py-4 rounded-2xl flex items-center justify-center">
                        <i class="fas fa-sign-out-alt mr-2"></i> KELUAR
                    </button>
                </div>
            </div>
        </div>
    </main>

    <div id="loading-overlay" class="fixed inset-0 bg-black/80 backdrop-blur-md hidden flex items-center justify-center z-50">
        <div class="animate-spin rounded-full h-12 w-12 border-4 border-cyan-500 border-t-transparent"></div>
    </div>

    <script>
        const SPREADSHEET_ID = '1n2AbcanvLazitNX5DEHzXSyJAkasi-aPwV9p8Enrscg';
        const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv`;
        const LOGO_SEKOLAH_DRIVE = 'https://drive.google.com/file/d/1x1MSfNaTTi7orhMLm32rzdmWblRZbqoQ/view';
        const BANNER_LOGO_DRIVE = 'https://drive.google.com/file/d/1K6HO-kZnuRyiXHhvJkKRbCiquyv6_8HC/view';

        function getDirectDriveLink(url) {
            if (!url) return '';
            const driveIdMatch = url.match(/\/file\/d\/([^\/]+)\//) || url.match(/[?&]id=([^&]+)/);
            return driveIdMatch ? `https://lh3.googleusercontent.com/u/0/d/${driveIdMatch[1]}=w800` : url;
        }

        // Web Audio Engine
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playSynthSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            switch(type) {
                case 'pop': // Balloon Pop
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.1);
                    break;
                case 'boom': // Fireworks Explode
                    const noise = audioCtx.createBufferSource();
                    const bufferSize = audioCtx.sampleRate * 0.5;
                    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                    const data = buffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
                    noise.buffer = buffer;
                    const filter = audioCtx.createBiquadFilter();
                    filter.type = 'lowpass';
                    filter.frequency.setValueAtTime(400, audioCtx.currentTime);
                    filter.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + 0.4);
                    const nGain = audioCtx.createGain();
                    nGain.gain.setValueAtTime(0.8, audioCtx.currentTime);
                    nGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                    noise.connect(filter);
                    filter.connect(nGain);
                    nGain.connect(audioCtx.destination);
                    noise.start();
                    break;
                case 'whistle': // Firework Launch
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.4);
                    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.4);
                    break;
                case 'clap': // Clapping
                    const cNoise = audioCtx.createBufferSource();
                    const cBuffer = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.1, audioCtx.sampleRate);
                    const cData = cBuffer.getChannelData(0);
                    for (let i = 0; i < cData.length; i++) cData[i] = Math.random() * 2 - 1;
                    cNoise.buffer = cBuffer;
                    const cFilter = audioCtx.createBiquadFilter();
                    cFilter.type = 'bandpass';
                    cFilter.frequency.value = 1000;
                    const cGain = audioCtx.createGain();
                    cGain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    cGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                    cNoise.connect(cFilter);
                    cFilter.connect(cGain);
                    cGain.connect(audioCtx.destination);
                    cNoise.start();
                    break;
            }
        }

        // Perayaan Elements
        function createBalloons() {
            const container = document.getElementById('balloon-container');
            for (let i = 0; i < 15; i++) {
                setTimeout(() => {
                    const b = document.createElement('div');
                    b.className = 'balloon';
                    const size = Math.random() * 30 + 40;
                    b.style.width = size + 'px';
                    b.style.height = (size * 1.3) + 'px';
                    b.style.left = Math.random() * 90 + 'vw';
                    b.style.backgroundColor = `hsl(${Math.random()*360}, 70%, 60%)`;
                    b.style.animationDuration = (Math.random() * 3 + 4) + 's';
                    b.onclick = () => { playSynthSound('pop'); b.remove(); };
                    container.appendChild(b);
                    setTimeout(() => { if(b.parentNode) { playSynthSound('pop'); b.remove(); } }, 6000);
                }, i * 300);
            }
        }

        function createFirecrackers() {
            for (let i = 0; i < 12; i++) {
                setTimeout(() => {
                    const fc = document.createElement('div');
                    fc.className = 'firecracker-visual';
                    fc.style.left = Math.random() * 100 + 'vw';
                    fc.style.top = '100vh';
                    fc.style.setProperty('--tx', (Math.random() * 400 - 200) + 'px');
                    fc.style.setProperty('--ty', -(Math.random() * 500 + 300) + 'px');
                    document.body.appendChild(fc);
                    playSynthSound('whistle');
                    setTimeout(() => {
                        playSynthSound('pop');
                        confetti({ origin: { x: parseInt(fc.style.left)/100, y: 0.5 }, particleCount: 20, spread: 50, colors: ['#ff0000', '#ffff00'] });
                        fc.remove();
                    }, 800);
                }, i * 200);
            }
        }

        function createFireworks() {
            playSynthSound('whistle');
            setTimeout(() => {
                playSynthSound('boom');
                confetti({
                    particleCount: 150, spread: 360, startVelocity: 45,
                    origin: { x: Math.random(), y: Math.random() * 0.5 }
                });
            }, 500);
        }

        function showClap() {
            const emoji = document.createElement('div');
            emoji.className = 'clap-emoji';
            emoji.innerText = '👏';
            document.body.appendChild(emoji);
            for(let i=0; i<5; i++) setTimeout(() => playSynthSound('clap'), i * 100);
            setTimeout(() => emoji.remove(), 1000);
        }

        let celebrationCycle = 0;
        function startLoop() {
            const run = () => {
                switch(celebrationCycle % 4) {
                    case 0: confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } }); break;
                    case 1: createFireworks(); createFireworks(); break;
                    case 2: createBalloons(); break;
                    case 3: createFirecrackers(); showClap(); break;
                }
                celebrationCycle++;
            };
            run();
            setInterval(run, 4000);
        }

        // Logic Auth
        const loginForm = document.getElementById('login-form');
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            document.getElementById('loading-overlay').classList.remove('hidden');
            const inputNisn = document.getElementById('nisn').value;
            const inputDob = document.getElementById('dob').value.split('-').reverse().join(''); // ddmmyyyy

            try {
                const res = await fetch(SHEET_URL);
                const text = await res.text();
                const rows = text.split('\n').map(r => r.split(',').map(c => c.replace(/"/g, '').trim()));
                const student = rows.find(r => r[0] === inputNisn && r[1] === inputDob);

                if (student) {
                    setTimeout(() => {
                        document.getElementById('loading-overlay').classList.add('hidden');
                        document.getElementById('login-section').classList.add('hidden');
                        const rs = document.getElementById('result-section');
                        rs.classList.remove('hidden');
                        setTimeout(() => rs.classList.add('opacity-100'), 50);

                        document.getElementById('student-name').innerText = student[2];
                        document.getElementById('display-nisn').innerText = `NISN: ${student[0]} | KELAS: ${student[3]}`;
                        document.getElementById('student-photo').src = getDirectDriveLink(student[5]) || `https://ui-avatars.com/api/?name=${student[2]}`;
                        
                        const isLulus = student[4].toLowerCase() === 'lulus';
                        const badge = document.getElementById('badge-status');
                        const msg = document.getElementById('result-message');
                        
                        if(isLulus) {
                            badge.innerText = 'Lulus';
                            badge.classList.add('bg-green-500', 'text-white');
                            msg.innerText = 'SELAMAT! ANDA DINYATAKAN LULUS';
                            msg.classList.add('text-cyan-500');
                            startLoop();
                        } else {
                            badge.innerText = 'Tidak Lulus';
                            badge.classList.add('bg-red-500', 'text-white');
                            msg.innerText = 'MAAF, ANDA DINYATAKAN TIDAK LULUS';
                            msg.classList.add('text-red-500');
                        }
                    }, 1500);
                } else {
                    throw new Error();
                }
            } catch (err) {
                document.getElementById('loading-overlay').classList.add('hidden');
                const errBox = document.getElementById('error-msg');
                errBox.innerText = "Data tidak ditemukan. Periksa NISN & Tgl Lahir.";
                errBox.classList.remove('hidden');
            }
        });

        // Theme Init
        document.getElementById('theme-toggle').onclick = () => {
            document.body.classList.toggle('dark-mode');
        };
        window.onload = () => {
            document.getElementById('school-logo').src = getDirectDriveLink(LOGO_SEKOLAH_DRIVE);
            document.getElementById('banner-logo').src = getDirectDriveLink(BANNER_LOGO_DRIVE);
        };
    </script>
</body>
</html>
